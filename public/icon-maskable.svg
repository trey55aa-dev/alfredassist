<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d8b36a"/>
      <stop offset="100%" stop-color="#b8893a"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background so the maskable safe zone is always filled -->
  <rect width="512" height="512" fill="#0a0d14"/>
  <!-- Smaller "A" kept within the ~80% safe circle -->
  <text x="256" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="240" font-weight="600"
        text-anchor="middle" fill="url(#gold)">A</text>
</svg>
